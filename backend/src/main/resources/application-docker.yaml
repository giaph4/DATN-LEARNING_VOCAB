# Running inside compose (profile "app"): services are reached by container name.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/vocab_learning?connectionTimeZone=UTC&characterEncoding=UTF-8}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
  mail:
    host: ${SPRING_MAIL_HOST:mailpit}

app:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    create-bucket: true
